# Retrieval cases for the box (W10), in the support bot's case format (only the fields
# eval.py reads). What the support bot's cases don't cover: questions in languages the
# guide isn't written in (the field team's, not the guide's), and exact names and error
# messages, where meaning-only search tends to miss.

- id: box-sw-export-excel
  category: multilingual
  language: sw
  message: Ninawezaje kupakua data yangu kama faili ya Excel?
  expect:
    retrieve_any: [https://support.kobotoolbox.org/export_download]

- id: box-ar-gps-question
