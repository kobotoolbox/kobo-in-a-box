# Retrieval cases for the collections beyond the Kobo guide (W10): the ODK documentation,
# XLSForm.org and QGIS. Expected pages are the library's (http://kobo.local/docs/...). A
# question the Kobo guide also answers may be found there instead, so these ask what
# mostly the other collection covers.

- id: odk-offline-maps
  category: collections
  language: en
  message: how do I put an offline basemap (mbtiles) on the phone for the geopoint question?
  expect:
    retrieve_any:
      - http://kobo.local/docs/odk/collect-offline-maps.html

- id: odk-regex-constraint
  category: collections
  language: en
  message: regex constraint to check a phone number has exactly 10 digits
  expect:
    retrieve_any:
      - http://kobo.local/docs/odk/form-regex.html

- id: odk-audit-log
  category: collections
  language: en
  message: can I record how long enumerators spend on each question?
  expect:
    retrieve_any:
      - http://kobo.local/docs/odk/form-audit-log.html
      - https://support.kobotoolbox.org/audit_logging

