# Agents on the box (W4): the agent model's llama-server, kobo-mcp and OpenCode.
# Started by agents.sh, which writes opencode/opencode.json and sets the env.
#
#   agent-llm  profile `llm`: the agent model on the GPU, published on :8083
#   opencode   `opencode serve` on :4096, its shell tools inside this container (the
#              analysis sandbox, PLAN 3d), reaching the model at AGENT_LLM_URL and the
#              box's kobo-mcp at http://mcp.kobo.local (dash/: dashboards need it too)

services:
  agent-llm:
    profiles: [llm]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    volumes:
      - /opt/models:/models:ro
    ports: ["8083:8080"]
    # Restarted by box/watchdog.sh if it stops answering (as the AI services)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "10", "-o", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 30m
    labels:
      kobo-box.watchdog: restart
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >-
      -m /models/${AGENT_MODEL} --alias agent --host 0.0.0.0 --port 8080
      -c ${AGENT_CTX} --parallel ${AGENT_SLOTS} -ngl ${AGENT_NGL} -t ${AGENT_THREADS}
      --jinja --chat-template-kwargs '{"enable_thinking":${AGENT_THINKING:-false}}' --metrics

  opencode:
    profiles: [agents]
    image: kobo-box-opencode:${OPENCODE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.opencode
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION}
    restart: unless-stopped
    # kobo-mcp through the edge, as the box's own name (its Host check)
    extra_hosts:
      - "mcp.kobo.local:host-gateway"
      - "knowledge.kobo.local:host-gateway"   # the knowledge base (knowledge/), when it runs
    # OpenCode connects to its MCP servers once, at start, and doesn't retry: wait for
    # kobo-mcp (another compose project), or a cold start leaves the Kobo tools "failed"
    command:
      - sh
      - -c
      - >-
        until node -e 'fetch("http://mcp.kobo.local/healthz").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))';
        do sleep 2; done;
        exec opencode serve --hostname 0.0.0.0 --port 4096
    ports: ["127.0.0.1:4096:4096"]
    environment:
      OPENCODE_CONFIG: /config/opencode.json
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_MODELS_FETCH: "true"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
      OPENCODE_DISABLE_CLAUDE_CODE: "true"
      KOBO_TOKEN: ${KOBO_TOKEN:-}
    volumes:
      - ./opencode:/config:ro
      - opencode-workspace:/workspace
      - opencode-data:/root/.local/share/opencode
    # kobo-assistant: case management's tools (espocrm/cases_mcp.py), when it's on the box
    networks: [default, kobo-assistant]

networks:
  kobo-assistant:
    external: true

volumes:
  opencode-workspace:
  opencode-data:
