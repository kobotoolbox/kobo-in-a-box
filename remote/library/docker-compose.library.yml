# Edge nginx: the library at http://kobo.local, and Kobo's hostnames proxied to
# kobo-docker's nginx on 127.0.0.1:8080. Host networking so it owns port 80 on
# every interface (the field Wi-Fi included) without touching Kobo's networks.
services:
  edge:
    image: ${EDGE_IMAGE}
    network_mode: host
    restart: unless-stopped
    volumes:
      # The folder, not the file: a file bind mount keeps the old copy when edge.conf is
      # replaced (an update), so nginx would go on serving the old config
      - ./nginx:/etc/nginx/conf.d:ro
      - ${LIBRARY_DIR}:/srv/library:ro
      # Basemap tiles for the dashboards (content pack maps/tiles, dash.sh tiles)
      - ${MAPS_DIR:-/opt/maps}:/srv/maps:ro
