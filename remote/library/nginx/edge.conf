# Edge nginx on port 80 (host network). Kobo's hostnames go to kobo-docker's own
# nginx, which kobo-install's proxy mode publishes on 8080; anything else, including
# http://kobo.local and the box's bare IP, gets the library.

server {
    listen 80;
    server_name kf.* kc.* ee.*;

    # Kobo's nginx and uWSGI enforce their own limits. Stream large media
    # uploads straight through, and outlast uWSGI's 120 s harakiri.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Case management (W11, remote/espocrm/), when it runs: EspoCRM on 127.0.0.1:8084
server {
    listen 80;
    server_name cases.*;

    client_max_body_size 50m;  # case attachments

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80 default_server;
    server_name _;
    root /srv/library;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # Build markers and per-file checksums
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
    location /files/ {
        autoindex on;
        autoindex_exact_size off;
    }
    # Not in nginx's mime.types; Android needs it to offer the install
    location ~ \.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
    }
}
