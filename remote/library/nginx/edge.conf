# Edge nginx on port 80 (host network). Kobo's hostnames go to kobo-docker's own
# nginx, which kobo-install's proxy mode publishes on 8080; anything else, including
# http://kobo.local and the box's bare IP, gets the library.

# Kobo answers only to its own names. Phones use kf/kc/ee.kobo.local; other kits reach
# this one by its name, kf.<box name>.local (box sync, box/sync.py): both are Kobo here
map $host $kobo_host {
    ~^kf\. kf.kobo.local;
    ~^kc\. kc.kobo.local;
    ~^ee\. ee.kobo.local;
    default $host;
}
# The domain the client used after kf./kc./ee. (kobo.local, or <box name>.local)
map $host $kobo_client_domain {
    ~^(?:kf|kc|ee)\.(?<kobo_domain>.+)$ $kobo_domain;
    default kobo.local;
}

server {
    listen 80;
    server_name kf.* kc.* ee.*;

    # Kobo's nginx and uWSGI enforce their own limits. Stream large media
    # uploads straight through, and outlast uWSGI's 120 s harakiri.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $kobo_host;
        # A redirect stays under the name the client used, not kobo.local (which, on
        # another kit, is that kit's own Kobo); unchanged for phones. Named captures: the
        # map's own regex would overwrite numbered ones while this is built
        proxy_redirect ~^http://(?<kobo_sub>kf|kc|ee)\.kobo\.local(?<kobo_path>/.*)?$ $scheme://$kobo_sub.$kobo_client_domain$kobo_path;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Case management (W11, remote/espocrm/), when it runs: EspoCRM on 127.0.0.1:8084
server {
    listen 80;
    server_name cases.*;

    client_max_body_size 50m;  # case attachments

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Dashboards (W9, remote/dash/), when they run: kobo-dash on 127.0.0.1:8086
server {
    listen 80;
    server_name dash.*;

    client_max_body_size 10m;  # admin GeoJSON uploads (kobo-dash caps them at 3 MB)

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Live updates in open dashboards: server-sent events, held open (kobo-dash pings
    # every 25 s and sends X-Accel-Buffering: no)
    location ~ ^/api/d/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# The box's kobo-mcp (remote/dash/): the agent's Kobo tools, and the sign-in page for
# dashboard owners, on 127.0.0.1:8085
server {
    listen 80;
    server_name mcp.*;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MCP answers may stream (SSE), and some tools (exports) take minutes
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# Paper forms (W13, remote/paper/), when they run: kobo-field-forms on 127.0.0.1:8087,
# with its own password
server {
    listen 80;
    server_name paper.*;

    client_max_body_size 200m;  # a scanned stack of sheets as one PDF
    proxy_read_timeout 600s;    # reading a batch of sheets with the vision model

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# The knowledge base (W10, remote/knowledge/), when it runs: search and the agent's MCP
# tools on 127.0.0.1:8088. Read-only, and only documentation (never personal data)
server {
    listen 80;
    server_name knowledge.*;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

# Offline maps (remote/maps/), when they run: tileserver-gl on 127.0.0.1:8090. It draws
# image tiles on demand; each is drawn once, then kept here (the map changes only with a
# new pack or country, and `maps.sh up` empties the cache then)
proxy_cache_path /var/cache/nginx/maps levels=1:2 keys_zone=maps:10m max_size=2g inactive=90d use_temp_path=off;
server {
    listen 80;
    server_name maps.*;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Tiles, fonts and icons hold no host names: one cached copy for every name the box
    # answers to (TileJSON and style.json do, so they aren't cached)
    location ~ ^/(styles/[^/]+/\d+/\d+/\d+(@\dx)?\.(png|jpg|webp)|data/[^/]+/\d+/\d+/\d+\.pbf|fonts/.*\.pbf)$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache maps;
        proxy_cache_key $uri;
        proxy_cache_valid 200 204 90d;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin "*";
    }
    # The whole map, and QGIS's layer files (maps.py downloads)
    location = /download/basemap.pmtiles {
        alias /srv/maps/basemap/basemap.pmtiles;
        default_type application/vnd.pmtiles;
        add_header Access-Control-Allow-Origin "*";
    }
    location /download/ {
        alias /srv/maps/basemap/download/;
        types { application/xml qlr xml; }
        default_type application/octet-stream;
    }
}

server {
    listen 80 default_server;
    server_name _;
    root /srv/library;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # Build markers and per-file checksums
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }
    # The label card (box/card.py) holds the admin password and the backup passphrase:
    # only for a browser on the box itself, never for the Wi-Fi
    location /card/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        add_header Cache-Control "no-store";
    }
    # Kobo accounts for a team (box/users.py, kobo-box-users.service): Kobo admins sign
    # in with their Kobo password. A long list takes minutes (two KPI calls per account)
    location /users/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        client_max_body_size 3m;
    }
    location = /users { return 301 /users/; }
    # The status page is rewritten every minute (box/status.py)
    location /status/ {
        add_header Cache-Control "no-store";
    }
    # Basemap tiles under the dashboards' maps (dash.sh tiles): {z}/{x}/{y}.png
    location /tiles/ {
        alias /srv/maps/tiles/;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin "*";
    }
    location /files/ {
        autoindex on;
        autoindex_exact_size off;
    }
    # Not in nginx's mime.types; Android needs it to offer the install
    location ~ \.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
    }
}
