# Local inference services for Kobo-in-a-box.
# Both expose OpenAI-compatible endpoints:
#   llm      http://llm:8080/v1/chat/completions
#   whisper  http://whisper:8080/v1/audio/transcriptions
# They join the kobo-docker frontend network so KPI can reach them by name,
# and are published on the host at 8081/8082 for testing.

x-limits: &limits
  mem_limit: ${AI_MEM_LIMIT}
  cpus: ${AI_CPUS}
  restart: unless-stopped
  volumes:
    - /opt/models:/models:ro
  networks:
    - kobo

# A server that stops answering is restarted by box/watchdog.sh (run with the status page
# every minute): Docker's own restart policy only covers a process that exits. /health is
# answered outside the inference loop, so a long transcription or a queue of translations
# doesn't count as hung; a deadlocked or wedged server does. start_period: loading a big
# model takes minutes, and failures until the first success don't count
x-llm-health: &llm-health
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-m", "10", "-o", "/dev/null", "http://localhost:8080/health"]
    interval: 30s
    timeout: 15s
    retries: 4
    start_period: 20m
  labels:
    kobo-box.watchdog: restart

x-whisper-health: &whisper-health
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-m", "10", "-o", "/dev/null", "http://localhost:8080/"]
    interval: 30s
    timeout: 15s
    retries: 4
    start_period: 5m
  labels:
    kobo-box.watchdog: restart

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  llm-gpu:
    <<: [*limits, *gpu, *llm-health]
    profiles: [gpu]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    networks:
      kobo:
        aliases: [llm]
    ports: ["8081:8080"]
    command: >-
      -m /models/${LLM_MODEL} ${LLM_MMPROJ:+--mmproj /models/${LLM_MMPROJ}}
      --host 0.0.0.0 --port 8080 -c ${LLM_CTX} -ngl ${LLM_NGL} -t ${LLM_THREADS}
      --chat-template-kwargs '{"enable_thinking":${LLM_THINKING:-true}}' --metrics ${LLM_EXTRA_ARGS:-}

  whisper-gpu:
    <<: [*limits, *gpu, *whisper-health]
    profiles: [gpu]
    image: ghcr.io/ggml-org/whisper.cpp:main-cuda
    networks:
      kobo:
        aliases: [whisper]
    ports: ["8082:8080"]
    command:
      - >-
        whisper-server -m /models/${WHISPER_MODEL} --host 0.0.0.0 --port 8080
        -t ${WHISPER_THREADS} --convert -l auto
        --inference-path /v1/audio/transcriptions

  llm-cpu:
    <<: [*limits, *llm-health]
    profiles: [cpu]
    image: ghcr.io/ggml-org/llama.cpp:server
    networks:
      kobo:
        aliases: [llm]
    ports: ["8081:8080"]
    command: >-
      -m /models/${LLM_MODEL} ${LLM_MMPROJ:+--mmproj /models/${LLM_MMPROJ}}
      --host 0.0.0.0 --port 8080 -c ${LLM_CTX} -t ${LLM_THREADS}
      --chat-template-kwargs '{"enable_thinking":${LLM_THINKING:-true}}' --metrics ${LLM_EXTRA_ARGS:-}

  whisper-cpu:
    <<: [*limits, *whisper-health]
    profiles: [cpu]
    image: ghcr.io/ggml-org/whisper.cpp:main
    networks:
      kobo:
        aliases: [whisper]
    ports: ["8082:8080"]
    command:
      - >-
        whisper-server -m /models/${WHISPER_MODEL} --host 0.0.0.0 --port 8080
        -t ${WHISPER_THREADS} --convert -l auto --no-gpu
        --inference-path /v1/audio/transcriptions

networks:
  kobo:
    external: true
    name: ${KOBO_NETWORK}
